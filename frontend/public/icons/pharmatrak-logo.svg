<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for the counting tray -->
    <linearGradient id="trayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for tray rim -->
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Text shadow -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.4"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#f8f9fa"/>
  
  <!-- Counting tray (main body) -->
  <rect x="50" y="90" width="300" height="80" rx="8" ry="8" 
        fill="url(#trayGradient)" filter="url(#dropshadow)" stroke="#1976d2" stroke-width="2"/>
  
  <!-- Tray rim (raised edge) -->
  <rect x="46" y="86" width="308" height="88" rx="12" ry="12" 
        fill="none" stroke="url(#rimGradient)" stroke-width="4" opacity="0.8"/>
  
  <!-- Tray dividers -->
  <line x1="140" y1="90" x2="140" y2="170" stroke="#1976d2" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="90" x2="200" y2="170" stroke="#1976d2" stroke-width="1" opacity="0.4"/>
  <line x1="260" y1="90" x2="260" y2="170" stroke="#1976d2" stroke-width="1" opacity="0.4"/>
  
  <!-- Tablets/pills scattered on tray -->
  <!-- Round tablets -->
  <circle cx="80" cy="120" r="6" fill="#ff9800" stroke="#f57c00" stroke-width="1"/>
  <circle cx="120" cy="140" r="5" fill="#4caf50" stroke="#388e3c" stroke-width="1"/>
  <circle cx="170" cy="115" r="7" fill="#f44336" stroke="#d32f2f" stroke-width="1"/>
  <circle cx="220" cy="135" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="1"/>
  <circle cx="270" cy="125" r="6" fill="#9c27b0" stroke="#7b1fa2" stroke-width="1"/>
  <circle cx="110" cy="110" r="4" fill="#ffeb3b" stroke="#fbc02d" stroke-width="1"/>
  <circle cx="180" cy="150" r="5" fill="#607d8b" stroke="#455a64" stroke-width="1"/>
  <circle cx="240" cy="110" r="6" fill="#795548" stroke="#5d4037" stroke-width="1"/>
  <circle cx="300" cy="145" r="5" fill="#009688" stroke="#00695c" stroke-width="1"/>
  
  <!-- Oval/capsule tablets -->
  <ellipse cx="95" cy="155" rx="8" ry="4" fill="#e91e63" stroke="#c2185b" stroke-width="1"/>
  <ellipse cx="155" cy="135" rx="7" ry="3" fill="#3f51b5" stroke="#303f9f" stroke-width="1"/>
  <ellipse cx="285" cy="120" rx="9" ry="4" fill="#ff5722" stroke="#e64a19" stroke-width="1"/>
  <ellipse cx="130" cy="125" rx="6" ry="3" fill="#cddc39" stroke="#afb42b" stroke-width="1"/>
  
  <!-- Spatula -->
  <g transform="translate(320, 100) rotate(25)">
    <!-- Spatula handle -->
    <rect x="0" y="-2" width="40" height="4" fill="#8d6e63" rx="2"/>
    <!-- Spatula blade -->
    <ellipse cx="42" cy="0" rx="12" ry="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
    <!-- Handle grip lines -->
    <line x1="8" y1="-1" x2="8" y2="1" stroke="#5d4037" stroke-width="0.5"/>
    <line x1="16" y1="-1" x2="16" y2="1" stroke="#5d4037" stroke-width="0.5"/>
    <line x1="24" y1="-1" x2="24" y2="1" stroke="#5d4037" stroke-width="0.5"/>
    <line x1="32" y1="-1" x2="32" y2="1" stroke="#5d4037" stroke-width="0.5"/>
  </g>
  
  <!-- PharmaTraK Text with doctor-style lettering -->
  <text x="200" y="50" text-anchor="middle" 
        font-family="serif" 
        font-size="38" 
        font-weight="bold" 
        fill="#1565c0" 
        filter="url(#textShadow)"
        style="letter-spacing: 2px;">
    PharmaTraK
  </text>
  
  <!-- Decorative medical elements -->
  <!-- Prescription Rx symbol -->
  <g transform="translate(30, 30)">
    <text font-family="serif" font-size="24" font-weight="bold" fill="#1976d2" opacity="0.6">℞</text>
  </g>
  
  <!-- Pills icon -->
  <g transform="translate(350, 30)">
    <circle cx="0" cy="0" r="6" fill="#4caf50" opacity="0.6"/>
    <circle cx="12" cy="4" r="5" fill="#2196f3" opacity="0.6"/>
    <circle cx="6" cy="14" r="4" fill="#ff9800" opacity="0.6"/>
  </g>
  
  <!-- Subtle tagline -->
  <text x="200" y="185" text-anchor="middle" 
        font-family="sans-serif" 
        font-size="12" 
        font-weight="normal" 
        fill="#666" 
        opacity="0.8">
    Professional Pharmacy Management System
  </text>
</svg>