version: '3.8'

# Docker Swarm Stack configuration for PharmaTraK
# Use this for production deployments with Docker Swarm

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/drug_schema.sql:/docker-entrypoint-initdb.d/02-drug_schema.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --max-connections=200
    networks:
      - pharmatrak-network
    secrets:
      - mysql_root_password
      - mysql_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      timeout: 20s
      retries: 10
      interval: 30s

  # Backend API
  backend:
    image: pharmatrak_backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/mysql_password
      DB_NAME: ${DB_NAME}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGIN: ${FRONTEND_URL}
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - pharmatrak-network
    secrets:
      - mysql_password
      - jwt_secret
      - redis_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React App with Nginx
  frontend:
    image: pharmatrak_frontend:latest
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 443
        published: 443
        mode: ingress
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - pharmatrak-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: redis-server --requirepass-file /run/secrets/redis_password
    volumes:
      - redis_data:/data
    networks:
      - pharmatrak-network
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin setup service (runs once)
  admin-setup:
    image: pharmatrak_admin:latest
    build:
      context: .
      dockerfile: Dockerfile.admin-setup
    deploy:
      replicas: 1
      restart_policy:
        condition: none
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/mysql_password
      DB_NAME: ${DB_NAME}
    depends_on:
      - mysql
    networks:
      - pharmatrak-network
    secrets:
      - mysql_password

  # Monitoring with Portainer (optional)
  portainer:
    image: portainer/portainer-ce:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - pharmatrak-network

networks:
  pharmatrak-network:
    driver: overlay
    attachable: true

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  portainer_data:
    driver: local

secrets:
  mysql_root_password:
    external: true
  mysql_password:
    external: true
  jwt_secret:
    external: true
  redis_password:
    external: true

# Deploy with:
# docker stack deploy --compose-file docker-stack.yml pharmatrak
#
# Create secrets first:
# echo "your_mysql_root_password" | docker secret create mysql_root_password -
# echo "your_mysql_password" | docker secret create mysql_password -
# echo "your_jwt_secret" | docker secret create jwt_secret -
# echo "your_redis_password" | docker secret create redis_password -